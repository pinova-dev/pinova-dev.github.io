
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s;
            margin: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
        }
        
        .user-info {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }
        
        .user-info.active {
            display: block;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <h1>Nova App</h1>
        <p class="description">
            مرحباً بك في تطبيق Nova - بوابتك نحو المستقبل الرقمي
        </p>
        
        <button class="btn" id="loginBtn">تسجيل الدخول بـ Pi</button>
        
        <div class="user-info" id="userInfo">
            <h3>مرحباً، <span id="username"></span>!</h3>
            <p>تم تسجيل دخولك بنجاح</p>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        // Initialize Pi SDK
        Pi.init({ version: "2.0", sandbox: true });
        
        const loginBtn = document.getElementById('loginBtn');
        const userInfo = document.getElementById('userInfo');
        const username = document.getElementById('username');
        const status = document.getElementById('status');
        
        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
            setTimeout(() => {
                status.className = 'status';
            }, 3000);
        }
        
        loginBtn.addEventListener('click', async () => {
            try {
                // Request Pi authentication
                const scopes = ['username', 'payments'];
                
                const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                if (authResult && authResult.user) {
                    username.textContent = authResult.user.username;
                    userInfo.classList.add('active');
                    loginBtn.style.display = 'none';
                    showStatus('تم تسجيل الدخول بنجاح!', 'success');
                }
            } catch (error) {
                console.error('Authentication error:', error);
                showStatus('حدث خطأ في تسجيل الدخول', 'error');
            }
        });
        
        function onIncompletePaymentFound(payment) {
            console.log('Incomplete payment found:', payment);
        }
        
        // Check if already authenticated
        window.addEventListener('load', () => {
            console.log('App loaded successfully');
        });
    </script>
</body>
</html>
